name: Release CI gate

on:
  workflow_call:
    inputs:
      tag:
        description: One-time maintainer-approved release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  require-green-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Record the one-time source CI waiver
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = 'v2.15.5'
          test "$(git rev-parse HEAD)" = '5d83423fc82011ffe8fa76e0cd0a10de4323560c'
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTE'
          Source CI waiver applies only to v2.15.5 at 5d83423fc82011ffe8fa76e0cd0a10de4323560c.
          The maintainer requested manual acceptance instead of further source verification.
          Windows, Linux, and Intel macOS source jobs passed. The Apple Silicon job
          repeatedly hung in the existing native OpenCode smoke and was cancelled.
          This is an explicit waiver, not a successful source CI result.
          Platform packaging, signing, complete-asset checks, and atomic publication remain required.
          NOTE

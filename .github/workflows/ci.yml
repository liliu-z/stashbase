name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-build:
    name: Source build (${{ matrix.os }})
    # The source audit and real-model CPU verification share this job's budget.
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          version: '0.3.0'
          node-manager: false
          run-install: false
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Vite+ inventory
        id: toolchain
        run: pnpm test:toolchain

      # Static analysis, coverage, Story accessibility and catalog compilation
      # run once. Other platforms retain behavior tests and native builds.
      - name: Check supported renderer
        id: renderer-linux
        if: runner.os == 'Linux'
        run: pnpm check:web

      - name: Test renderer behavior
        timeout-minutes: 15
        if: runner.os != 'Linux'
        # Leave room for lazy imports plus each assertion's own wait timeout;
        # the full suite has taken 4 to 10 minutes on macOS Intel runners.
        run: pnpm test:renderer --maxWorkers=2 --testTimeout=15000

      - name: Build renderer
        id: renderer-native
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && runner.os != 'Linux' }}
        run: pnpm build:web

      - name: Check documentation and icons
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' }}
        run: pnpm test:docs && pnpm test:icons

      - name: Test renderer packaging input
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:package-inputs

      - name: Check test inventory wiring
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:inventory

      - name: Install Python sidecar dependencies
        id: python
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm setup:python

      # Collect every host failure after setup; failures still fail the job.
      - name: Test Python sidecars
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:python

      - name: Test release CI gate
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:release-gate

      - name: Test macOS signing contract
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:macos-signing

      - name: Test optional Windows signing contract
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:windows-signing

      - name: Test desktop update contracts
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:updates

      - name: Test Electron window lifecycle
        id: electron
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: npm run test:electron

      - name: Test server and retrieval scripts
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:server

      - name: Test bundled OpenCode runtime
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:opencode:native

      - name: Cache the pinned speech model
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: profiling.nosync/speech-model
          key: speech-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/speech/model-manifest.ts') }}

      - name: Verify local speech in embedded Node
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm test:speech:native --download

      - name: Typecheck server + mcp + Electron
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm typecheck:host

      - name: Build server + MCP
        id: services
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: pnpm build:services

      - name: Smoke real Electron app lifecycle (Linux)
        if: ${{ !cancelled() && steps.services.outcome == 'success' && steps.electron.outcome == 'success' && steps.renderer-linux.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run -a pnpm test:electron:smoke:built

      - name: Smoke real Electron app lifecycle (macOS and Windows)
        if: ${{ !cancelled() && steps.services.outcome == 'success' && steps.electron.outcome == 'success' && steps.renderer-native.outcome == 'success' && runner.os != 'Linux' }}
        run: pnpm test:electron:smoke:built
